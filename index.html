<style>
@font-face{font-family:'sysfallback';src:local('sans-serif');}
:root{
  --bg:#eee9df; --paper:#fbf8f2; --card:#ffffff;
  --ink:#1f3350; --ink2:#3b5170; --sub:#8a8172;
  --accent:#a6321f; --accent-d:#7c2517;
  --ok:#2f6b4f; --ok-bg:#e2ede6;
  --keep:#8a6d1f; --keep-bg:#f3ebd6;
  --line:#ddd6c8; --line2:#cfc6b4;
  --serif:Georgia,'Charis SIL','Noto Serif','DejaVu Serif','Times New Roman',serif;
  --ipa:'Charis SIL','Gentium Plus','Noto Sans','DejaVu Sans','Segoe UI','Lucida Sans Unicode',Arial,sans-serif;
  --shadow:0 3px 10px rgba(31,51,80,.08), 0 1px 3px rgba(31,51,80,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',-apple-system,'Segoe UI',Roboto,sans-serif;
  overscroll-behavior-y:contain;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);
  box-shadow:0 0 24px rgba(0,0,0,.06);display:flex;flex-direction:column;}

/* top bar */
#topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20;}
#topbar .back{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);
  background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink);font-size:16px;}
#topbar .back.hidden{visibility:hidden;}
#topbar h1{font-family:var(--serif);font-size:17px;margin:0;flex:1;
  letter-spacing:.02em;font-weight:700;}
#topbar .stamp{font-size:10px;color:var(--sub);border:1px solid var(--line2);border-radius:5px;padding:2px 6px;}

#main{flex:1;padding:16px;padding-bottom:32px;}
.hidden{display:none !important;}

/* home */
.hero{text-align:center;padding:22px 8px 26px;}
.hero .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--sub);text-transform:uppercase;margin-bottom:6px;}
.hero h2{font-family:var(--serif);font-size:28px;margin:0 0 6px;color:var(--ink);}
.hero p{font-size:13px;color:var(--sub);margin:0;}
.hero.home-hero{padding-bottom:10px;}
.menu-grid{display:flex;flex-direction:column;gap:12px;}
.menu-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;}
.menu-card .ico{width:44px;height:44px;border-radius:10px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.menu-card.idm .ico{background:var(--ok);}   /* 熟語の単語帳（b10・b5・b8）の番号バッジは深緑 */
.menu-card .tx b{display:block;font-size:15.5px;margin-bottom:2px;}
.menu-card .tx span{font-size:12px;color:var(--sub);}
.menu-card .tag{margin-left:auto;font-family:var(--serif);font-size:20px;color:var(--line2);flex-shrink:0;}

/* setup screens */
.setup-block{margin-bottom:20px;}
.setup-block h3{font-size:12.5px;color:var(--sub);letter-spacing:.06em;margin:0 0 8px;text-transform:uppercase;}
.tabs{display:flex;flex-wrap:wrap;gap:8px;}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;
  cursor:pointer;color:var(--ink);white-space:nowrap;}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.chip.disabled{opacity:.4;cursor:not-allowed;}
.chip small{display:block;font-size:9px;opacity:.7;}
.startbtn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;box-shadow:0 3px 8px rgba(166,50,31,.28);}
.ct{display:inline-block;margin-left:4px;padding:0 5px;border-radius:5px;background:#dde9f7;color:#1d4f8c;font-weight:700;font-size:.92em;}
.pos-badge .ct{background:#fff;color:var(--ink2);}
.set-ctl{display:flex;gap:8px;margin:2px 0 10px;}
.set-ctl button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.set-unit{margin-bottom:6px;}
.set-unit-h{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14.5px;color:var(--ink);}
.set-unit-h b{font-size:13px;color:var(--sub);}
.goal-dir-tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--ink2);border-radius:6px;padding:1px 7px;margin-right:6px;}
.wm{display:inline-block;width:15px;height:15px;border-radius:3px;margin:1.5px;cursor:pointer;vertical-align:top;}
.wm.new{background:#e7dfcf;} .wm.seen{background:#f6e2a0;} .wm.rev{background:#e8a39a;} .wm.self{background:#9fcdb3;} .wm.fix{background:#2f6b4f;}
.wm.sel{outline:2px solid var(--ink);}
.wm-unit{margin:10px 0 2px;font-size:12px;color:var(--sub);font-weight:700;}
.spark{display:flex;align-items:flex-end;gap:4px;height:40px;margin-top:6px;}
.spark i{display:block;width:16px;background:var(--ok);border-radius:3px 3px 0 0;min-height:2px;}
.spark i.low{background:#c9a227;}
.tprog{height:8px;border-radius:4px;background:#e7dfcf;margin:4px 0 12px;overflow:hidden;} .tprog div{height:100%;background:var(--accent);}
.tq-stem{font-size:22px;font-weight:700;color:var(--ink);margin:6px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tq-stem .stem-read{font-size:12px;color:var(--sub);font-weight:400;}
.tq-fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.6;}
.tq-fb.ok{background:var(--ok-bg);color:var(--ok);} .tq-fb.ng{background:#fbe9e6;color:var(--accent);}
.goal-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.goal-card.done{opacity:.8;}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
.goal-top b{font-size:16px;color:var(--ink);} .goal-dl{font-size:12.5px;color:var(--accent);font-weight:700;}
.goal-range{font-size:12px;color:var(--sub);margin:4px 0 10px;line-height:1.5;}
.goal-bar{position:relative;height:16px;border-radius:8px;background:#e7dfcf;overflow:visible;}
.goal-fill{height:100%;border-radius:8px 0 0 8px;background:var(--ok);} .goal-fill.full{border-radius:8px;}
.goal-plan{position:absolute;top:-4px;width:3px;height:24px;background:var(--ink);border-radius:2px;}
.goal-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-top:8px;gap:8px;flex-wrap:wrap;}
.goal-meta .ahead{color:var(--ok);font-weight:700;} .goal-meta .behind{color:var(--accent);font-weight:700;}
.goal-pace{font-size:13px;color:var(--ink);margin-top:8px;line-height:1.6;background:var(--bg);border-radius:10px;padding:8px 10px;}
.goal-note{font-size:12px;color:#8a5a00;background:#fff4d6;border-radius:8px;padding:6px 9px;margin-top:8px;line-height:1.5;}
.goal-btns{display:flex;gap:8px;margin-top:10px;}
.goal-btns button{flex:1;padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.goal-btns button.go{flex:2;background:var(--accent);border-color:var(--accent);color:#fff;}
.gf .row{margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.gf select,.gf input[type=number],.gf input[type=text],.gf input[type=date]{padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--card);color:var(--ink);font-family:inherit;max-width:100%;}
.gf input[type=number]{width:84px;} .gf input[type=text]{width:100%;box-sizing:border-box;}
.gf .lbl{font-size:12.5px;color:var(--sub);min-width:2.6em;}
.gf-preview{background:#eef5f0;border:1px solid #9fcdb3;border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.65;color:var(--ink);margin:6px 0 14px;}
.today-links{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;}
.gp-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;margin:0 0 14px;box-shadow:var(--shadow);}
.gp-tabs{display:flex;gap:8px;margin-bottom:12px;}
.gp-tab{flex:1;padding:9px 6px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.gp-tab.on{background:var(--ok);border-color:var(--ok);color:#fff;}
.gp-block{margin-bottom:12px;}
.gp-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px;}
.gp-label{font-size:14px;font-weight:700;color:var(--ink);}
.gp-val{font-size:13px;color:var(--ink);} .gp-val b{font-size:20px;margin-right:6px;}
.gp-val b.blue{color:#2860b8;} .gp-val b.ok{color:var(--ok);} .gp-val b.warn{color:#d2691e;}
.gp-bar{position:relative;height:18px;border-radius:9px;background:#e7dfcf;border:1px solid #bdb29b;overflow:visible;}
.gp-fill{height:100%;border-radius:9px 0 0 9px;min-width:0;} .gp-fill.full{border-radius:9px;}
.gp-fill.blue{background:#4a90e2;} .gp-fill.ok{background:var(--ok);} .gp-fill.warn{background:#e8923a;}
.gp-plan{position:absolute;top:-4px;width:3px;height:24px;background:var(--ink);border-radius:2px;}
.gp-sub{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.5;}
.gp-dir{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--sub);}
.gp-dir .chip{padding:5px 12px;font-size:13px;}
.today-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin:0 0 14px;box-shadow:var(--shadow);}
.today-top{display:flex;align-items:center;gap:14px;}
.ring-wrap{position:relative;width:88px;height:88px;flex-shrink:0;cursor:pointer;}
.ring-tx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;}
.ring-tx b{font-size:24px;color:var(--ink);} .ring-tx span{font-size:11px;color:var(--sub);}
.today-info{flex:1;min-width:0;}
.stat-row{display:flex;gap:6px;}
.stat-row>div{flex:1;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 2px;}
.stat-row b{font-size:20px;color:var(--ink);} .stat-row i{font-style:normal;font-size:11px;color:var(--sub);}
.stat-row small{display:block;font-size:10.5px;color:var(--sub);margin-top:1px;}
.home-stats{display:flex;justify-content:center;gap:6px;margin:2px 0 8px;}
.home-stats>div{flex:1;min-width:0;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 2px;white-space:nowrap;}
.home-stats b{font-size:18px;color:var(--ink);} .home-stats i{font-style:normal;font-size:11px;color:var(--sub);}
.home-stats small{font-size:11px;color:var(--sub);margin-left:1px;}
.gp-summary{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin:-2px 0 12px;font-size:12.5px;line-height:1.55;color:var(--ink);}
.gp-summary .gp-sum-range{font-weight:700;}
.gp-summary .gp-sum-meta{color:var(--sub);margin-top:1px;} .gp-summary .gp-sum-meta b{color:var(--ink);} .gp-summary .gp-sum-meta .over{color:#d2691e;font-weight:700;}
.today-msg{font-size:12.5px;color:var(--ink);margin-top:8px;line-height:1.5;}
.today-btn{width:100%;margin-top:12px;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 8px rgba(166,50,31,.25);}
.rv-btn{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.today-link{text-align:center;margin-top:10px;font-size:13px;color:var(--ink);text-decoration:underline;cursor:pointer;}
.app-toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:999;max-width:88%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.app-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px;}
.cal-head b{font-size:17px;color:var(--ink);font-family:var(--serif);}
.cal-head button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:42px;height:38px;font-size:18px;cursor:pointer;color:var(--ink);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:11px;color:var(--sub);padding:2px 0;}
.cal-cell{aspect-ratio:1/1;border-radius:9px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.15;}
.cal-cell small{font-size:10px;opacity:.85;}
.cal-cell.blank{background:transparent;border:none;cursor:default;}
.cal-cell.fut{opacity:.4;}
.cal-cell.l1{background:#f6e2a0;border-color:#c9a227;}
.cal-cell.l2{background:#9fcdb3;border-color:#2f6b4f;}
.cal-cell.l3{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700;}
.cal-cell.today{outline:3px solid var(--accent);outline-offset:-1px;}
.cal-cell.sel{box-shadow:0 0 0 2px var(--ink);}
.cal-detail{margin-top:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--ink);}
.cal-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--sub);align-items:center;}
.cal-legend i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:3px;border:1px solid var(--line);}
.setview-row{display:flex;gap:10px;margin-top:14px;}
.setview-btn{flex:1;border-radius:12px;padding:12px 8px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;line-height:1.35;border:2px solid;font-family:inherit;}
.setview-btn small{display:block;font-size:12px;font-weight:600;margin-top:2px;opacity:.85;}
.setview-btn.memo{color:#fff;background:var(--ok);border-color:var(--ok);box-shadow:0 3px 8px rgba(47,107,79,.28);}
.setview-btn.later{color:#5c4710;background:#f6e2a0;border-color:#c9a227;box-shadow:0 3px 8px rgba(201,162,39,.30);}
.bk-banner{background:#fff4d6;border:2px solid #c9a227;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:13px;line-height:1.6;color:#5c4710;}
.bk-banner b{display:block;font-size:14px;margin-bottom:2px;}
.bk-banner .bk-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.bk-banner button{flex:1;min-width:120px;padding:10px 8px;border-radius:9px;border:none;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;font-family:inherit;}
.bk-banner button.sub{background:transparent;color:#5c4710;border:1px solid #c9a227;flex:0 0 auto;min-width:0;padding:10px 14px;}
.startbtn:disabled{background:#c9c2b3;box-shadow:none;cursor:not-allowed;}
.subnote{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5;}

/* flashcard */
#fcHeader{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:10px;}
#fcHeader .setbtns{display:flex;gap:6px;}
#fcHeader .setbtn.on{background:var(--ink);border-color:var(--ink);color:#fff;}
#fcHeader .setbtn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:4px 9px;font-size:11.5px;cursor:pointer;color:var(--ink2);}
.progress-bar{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px;}
.progress-bar i{display:block;height:100%;background:var(--ink);}

.stage{position:relative;height:470px;}
@media (max-height:720px){.stage{height:400px;}}
.card-outer{position:absolute;inset:0;perspective:1400px;transition:transform .25s ease, opacity .25s ease;}
.card-outer.leaving-l{transform:translateX(-40px);opacity:0;}
.card-outer.leaving-r{transform:translateX(40px);opacity:0;}
.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);}
.card-outer.flipped .card-inner{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;}
.card-face.back{transform:rotateY(180deg);overflow-y:auto;}
.pos-badge{align-self:flex-start;font-size:10.5px;color:#fff;background:var(--ink2);border-radius:6px;
  padding:2px 8px;letter-spacing:.03em;margin-bottom:auto;}
.cf-num{position:absolute;top:16px;right:18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--line2);}
.front-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;}
.en-word{font-family:var(--serif);font-size:34px;font-weight:700;color:var(--ink);}
.en-ipa{font-size:16px;color:var(--sub);font-family:var(--ipa);}
.ja-word{font-size:26px;font-weight:700;color:var(--ink);}
.spk{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;
  background:var(--paper);border:1px solid var(--line2);color:var(--ink2);cursor:pointer;font-size:20px;flex-shrink:0;}
.spk:active{background:var(--line);}
.tapfoot{text-align:center;font-size:11px;color:var(--sub);}
.back .bhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.back .bhead .en{font-family:var(--serif);font-size:20px;font-weight:700;}
.back .bhead .ipa{font-size:13px;color:var(--sub);font-family:var(--ipa);}
.back .ja-line{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--ink2);}
.irr-line{font-size:12px;background:#fdeee9;color:var(--accent-d);border-radius:6px;padding:4px 8px;margin-bottom:8px;display:inline-block;}
.note-line{font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:10px;}
.ex-box{background:var(--paper);border-radius:10px;padding:10px 12px;border:1px solid var(--line);}
.ex-en{font-size:14.5px;line-height:1.5;margin-bottom:4px;font-family:var(--serif);}
.ex-ja{font-size:12.5px;color:var(--sub);}

.card-actions{display:flex;gap:10px;margin-top:16px;}
.act-btn{flex:1;padding:13px 6px;border-radius:12px;border:1px solid var(--line2);background:#fff;
  font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink);}
.act-btn.memo{color:var(--ok);border-color:var(--ok);background:var(--ok-bg);}
.act-btn.undo{color:var(--ink);border-color:var(--line2);background:#fff;font-size:14px;} .act-btn.undo small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-top:2px;} .act-btn.undo:disabled{opacity:.4;cursor:default;} .undo-row{margin-top:8px;}

  max-height:78vh;overflow-y:auto;padding:18px;}
.modal-sheet h3{margin:0 0 12px;font-size:15px;}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.modal-row button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;}
.modal-close{width:100%;padding:11px;border:none;border-radius:10px;background:var(--ink);color:#fff;margin-top:14px;font-size:14px;cursor:pointer;}
.empty-note{color:var(--sub);font-size:13px;padding:12px 0;}

/* quiz */
.quiz-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
.quiz-item .qnum{font-size:11.5px;color:var(--sub);margin-bottom:6px;}
.quiz-item .stem{font-size:16px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.quiz-item .stem-read{font-size:12px;color:var(--sub);font-weight:400;}
.qopt{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line2);border-radius:9px;margin-top:7px;font-size:13.5px;cursor:pointer;}
.qopt input{margin:0;}
.qopt.correct{border-color:var(--ok);background:var(--ok-bg);}
.qopt.wrong{border-color:var(--accent);background:#fbe9e6;}
.qctrl{display:flex;gap:8px;align-items:center;margin-top:10px;}
.qctrl button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;}
.qresult{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:6px;}
.qresult.ok{color:var(--ok);background:var(--ok-bg);}
.qresult.ng{color:var(--accent);background:#fbe9e6;}
.explain{margin-top:10px;background:var(--paper);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--ink2);line-height:1.6;}
.scorebar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 4px;

.scorebar b{font-size:18px;}
.scorebar button{background:var(--ink);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:13px;cursor:pointer;}

/* matching */

.mcard{aspect-ratio:1/1.05;border-radius:12px;display:flex;align-items:center;

  border:2px solid transparent;background:#fff;overflow:hidden;}
.mcard .mtext{font-size:clamp(14px,5.6vw,22px);font-weight:800;word-break:normal;overflow-wrap:anywhere;}
.mcard.en{border-color:var(--ink2);}
.mcard.en .mtext{color:var(--ink);}
.mcard.ja{border-color:var(--accent);}
.mcard.ja .mtext{color:var(--accent-d);}
.mcard.selected{border-color:#2f6b4f;box-shadow:0 0 0 3px rgba(47,107,79,.25);transform:scale(1.05);}
.mcard.mismatch{border-color:var(--accent);background:#fbe9e6;animation:shake .3s;}
.mcard.matched{background:#eee9df;border-color:var(--line2);cursor:default;}
.mcard.matched .mtext{color:#b8b0a0;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.mcard.facedown{background:var(--ink2);}
.mcard.facedown.en-back{background:var(--ink2);}
.mcard.facedown.ja-back{background:var(--accent);}
.mcard.facedown .mtext{color:rgba(255,255,255,.55);font-size:15px;font-weight:900;letter-spacing:.05em;}

function computeStreaks(){
  const keys=Object.keys(store.days).filter(studied);
  if(!keys.length) return {cur:0,best:0,total:0};
  const set=new Set(keys.map(keyToIdx));
  const resc=new Set(Object.keys(store.rescued||{}).map(keyToIdx));   // 救済した日：ノルマを達成した日として連続に数える（累計には数えない）
  const first=Math.min.apply(null,[...set]), todayI=keyToIdx(todayKey());

  const bi=bookIdx(g.book), fk=g.from[0]*1000+g.from[1], tk=g.to[0]*1000+g.to[1], D=bookData(g.book), nos=[];
  Object.keys(D).map(Number).sort((a,b)=>a-b).forEach(u=>{ D[u].forEach(r=>{ const k=u*1000+r.n; if(k>=fk && k<=tk) nos.push(bi*100000+k); }); });
  GOAL_CACHE[sig]={nos:nos, set:new Set(nos)};
  return nos;
}
function goalSet(g){ goalNos(g); return GOAL_CACHE[goalSig(g)].set; }
const GOAL_NAME={short:'短期目標',long:'長期目標'}, DIRS=['en2ja','ja2en'];
function goalOf(kind){ return store.goals.find(g=>g.kind===kind)||null; }
/* 各カード（語×方向）の到達周回（0〜周回数）。「覚えた」（その方向）のカードは出題しないが、「今の周は済ませた」ものとして数える */
function goalLevels(g){
  const P=g.passes, nos=goalNos(g), ms={en2ja:new Set(store.mastered.en2ja), ja2en:new Set(store.mastered.ja2en)}, out={};
  let L=P;
  DIRS.forEach(d=>nos.forEach(no=>{ if(!ms[d].has(no)){ const c=Math.min(P,g.cnt[d][no]||0); if(c<L) L=c; } }));
  DIRS.forEach(d=>{ out[d]=nos.map(no=> ms[d].has(no) ? Math.min(P, Math.max(g.cnt[d][no]||0, L+1)) : Math.min(P,g.cnt[d][no]||0)); });
  return out;
}
function goalMinLevel(lv,P){ let m=P; DIRS.forEach(d=>lv[d].forEach(l=>{ if(l<m) m=l; })); return m; }
function goalEligible(g){   // 今の周でまだ進めていないカード（方向別の語番号）
  const lv=goalLevels(g), nos=goalNos(g), P=g.passes, minL=goalMinLevel(lv,P), out={en2ja:[],ja2en:[]};
  if(minL>=P) return out;
  DIRS.forEach(d=>nos.forEach((no,i)=>{ if(lv[d][i]===minL) out[d].push(no); }));
  return out;
}
function bestPct(g){ return (g.tests||[]).reduce((m,t)=>Math.max(m,t.pct),0); }
function goalStats(g){
  const nos=goalNos(g), W=nos.length, P=g.passes, total=W*2*P, lv=goalLevels(g);
  let done=0; DIRS.forEach(d=>lv[d].forEach(l=>{ done+=l; }));
  const minL = W ? goalMinLevel(lv,P) : 0;
  let passLeft=0; if(minL<P) DIRS.forEach(d=>lv[d].forEach(l=>{ if(l===minL) passLeft++; }));
  const curPass=Math.min(P,minL+1);
  const tk=todayKey(), ti=keyToIdx(tk), di=keyToIdx(g.deadline);
  const todayN=(g.today && g.today.d===tk) ? g.today.n : 0;
  if(g.pv!==3){ g.pv=3; g.base=Math.max(0,done-todayN); g.created=tk; }   // 計算方法が変わる前に作った目標：計画を今日から引き直す
  const si=keyToIdx(g.created);
  const remain=Math.max(0,total-done), remainStart=remain+todayN;
  const daysLeft=di-ti+1;      // 今日を含めた残り日数
  let quota=0, overdue=false;
  if(remain>0 || todayN>0){
    if(daysLeft<=0){ overdue=true; quota=remainStart; }
    else{ const sd=Math.max(1,Math.ceil(daysLeft*g.spw/7)); quota=Math.ceil(remainStart/sd); }
  }
  /* 計画ライン：作成時点で済んでいた分（base）から、残りを「学習日」で均等に進める位置。expected＝今日のノルマを終えた時点でいるはずの位置 */
  const sdf=n=>Math.ceil(Math.max(0,n)*g.spw/7);
  const span=Math.max(1,di-si+1), spanSd=Math.max(1,sdf(span)), base=Math.min(total,g.base||0);
  const fe=Math.min(1,sdf(ti-si+1)/spanSd), fs=Math.min(1,sdf(ti-si)/spanSd);
  const planEnd=base+(total-base)*fe, expectedStart=base+(total-base)*fs;
  const ahead=Math.round((done-todayN)-expectedStart);   // 当初の計画ラインに対する、今日の開始時点の差
  /* 毎日のノルマは「残り÷残り学習日数」で引き直すので、遅れていても、そのノルマをやれば期限に間に合うペース。
     そのため、バーの目安位置（expected）は「今日の開始時点の進み＋今日のノルマ」にする */
  const expected=Math.min(total,(done-todayN)+quota);
  const weekly=Math.min(remainStart, quota*g.spw), monthly=Math.min(remainStart, Math.round(quota*g.spw*30/7));
  return {W:W,P:P,total:total,done:done,remain:remain,todayN:todayN,quota:quota,daysLeft:daysLeft,overdue:overdue,expected:expected,planEnd:planEnd,ahead:ahead,weekly:weekly,monthly:monthly,curPass:curPass,passLeft:passLeft,minL:minL};
}
function activeGoals(){ return store.goals.filter(g=>!g.doneAt).sort((a,b)=>a.kind==='short'?-1:1); }
function primaryGoal(){ return activeGoals()[0]||null; }   // 本日の目標は、短期目標から（なければ長期目標）
function goalRefreshDone(g){ g.doneAt=null; g.passesDone=null; if(goalStats(g).remain<=0){ g.passesDone=todayKey(); g.doneAt=todayKey(); } }
function goalInitCnt(g){   // 目標を作る前に学習したカード（学習記録がある語×方向）は、1周目を済ませたものとして扱う
  const nos=goalNos(g);
  DIRS.forEach(d=>{ const sn=store.seen[d]; nos.forEach(no=>{ if(g.cnt[d][no]===undefined && sn[no]) g.cnt[d][no]=1; }); });
}
function goalSetCursor(kind,dir,no){ const g=goalOf(kind); if(!g) return; g.cur[dir]=no; g.cur.last=dir; saveStore(); }
/* 進めるのは「今の周でまだ進めていないカード」だけ。同じ周で同じカードを何度学習しても、最後までやりきるまで次の周にはならない（1日の学習数には数える） */
function goalTouch(no,dir){
  let msg=null; const tk=todayKey();
  store.goals.forEach(g=>{
    if(g.doneAt || !goalSet(g).has(no)) return;
    if(store.mastered[dir].includes(no)) return;
    const minL=goalMinLevel(goalLevels(g),g.passes), lvl=g.cnt[dir][no]||0;
    if(lvl>minL || lvl>=g.passes) return;
    const s0=goalStats(g);
    g.cnt[dir][no]=lvl+1;
    if(!g.today || g.today.d!==tk) g.today={d:tk,n:0};
    g.today.n++;
    const s1=goalStats(g);
    if(s1.remain<=0){ g.passesDone=tk; g.doneAt=tk; msg='🎉 '+g.name+'を達成しました！'; }
    else if(s1.curPass>s0.curPass){ msg='✨ '+g.name+'：'+s0.curPass+'周目を最後までやりきりました！'; }
    else if(!msg && s0.todayN<s0.quota && s1.todayN>=s1.quota){ msg='🏆 '+g.name+'：今日の目標を達成しました！'; }
  });
  return msg;
}

const META_KEY='eitan_complete_meta_v2';

(function(){

/* ============ 単語検索（検索ボタンを押したときだけ全冊を検索） ============ */
const SEARCH_MAX = 100;
let searchState = {q:'', res:null, total:0};
let SIDX = null;   // 検索用の索引（初回の検索で1回だけ作る）
function normQ(s){
  return String(s).normalize('NFKC').toLowerCase()
    .replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))   // カタカナ→ひらがな
    .replace(/[~〜～]/g,'')
    .replace(/[【】《》()\[\]「」『』、，。,・･]/g,'')
    .replace(/\s+/g,' ').trim();
}
function buildSearchIndex(){
  SIDX = [];
  BOOKS.forEach(b=>{
    const D = bookData(b.id);
    bookUnitsAvail(b.id).forEach(u=>{
      D[u].forEach(r=>{
        SIDX.push({bk:b.id, bi:bookIdx(b.id), u:u, n:r.n, r:r,
          e: normQ(r.e.replace(/\s*\b[ABC]\b/g,'')),          // 熟語の A・B などの記号を除いた見出し語
          m: r.s.map(x=>normQ(x[1]))});                        // 意味（品詞ごと）
      });
    });
  });
}
function searchRank(it,q){
  let best = 99;
  const e = it.e;
  if(e===q) best=0;
  else if(e.startsWith(q)) best=1;
  else if((' '+e).includes(' '+q)) best=2;
  else if(e.includes(q)) best=3;
  if(best>3){
    for(const m of it.m){
      let k = (m===q) ? 4 : m.startsWith(q) ? 5 : m.includes(q) ? 6 : 99;
      if(k<best) best=k;
    }
  }
  return best;
}
function runSearch(raw){
  const q = normQ(raw);
  if(!q) return {res:[], total:0};
  if(!SIDX) buildSearchIndex();
  const hits = [];
  for(const it of SIDX){ const k=searchRank(it,q); if(k<99) hits.push({it:it,k:k}); }
  hits.sort((a,b)=> a.k-b.k || a.it.bi-b.it.bi || a.it.u-b.it.u || a.it.n-b.it.n);
  return {res:hits.slice(0,SEARCH_MAX).map(h=>h.it), total:hits.length};
}

    onkeydown="if(event.key==='Enter'){doSearch('${id}')}"><button class="srch-btn" onclick="doSearch('${id}')">検索</button></div>`;
}

function idxToKey(i){ const d=new Date(i*86400000), p2=n=>String(n).padStart(2,'0'); return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()); }
function dayLabelOf(k){ const d=keyToIdx(todayKey())-keyToIdx(k); return d===0?'今日':d===1?'昨日':dateJa(k); }
function bookOfNo(no){ return BOOKS.find(b=>bookIdx(b.id)===Math.floor(no/100000)); }
/* テスト結果の記録：別の日に2回正解した語は「定着」（覚えたセットへ）。間違えた語は復習セットへ */
function recordTest(no,dir,ok){
  const m=store.tw[dir], t=m[no]||(m[no]=[0,0,0]), di=keyToIdx(todayKey());
  if(ok){
    if(t[1]!==di){ t[0]++; t[1]=di; }
    t[2]=1;
    if(t[0]>=2){ if(!store.mastered[dir].includes(no)) store.mastered[dir].push(no); store.review[dir]=store.review[dir].filter(n=>n!==no); }
  } else {
    t[0]=0; t[2]=0;
    store.mastered[dir]=store.mastered[dir].filter(n=>n!==no);
    if(!store.review[dir].includes(no)) store.review[dir].push(no);
  }
}
function wordState(no,dir,ms,rs){
  const t=store.tw[dir][no];
  if(t && t[0]>=2 && t[2]===1) return 'fix';
  if(ms ? ms.has(no) : isMastered(no,dir)) return 'self';
  if((rs ? rs.has(no) : isReview(no,dir)) || (t && t[2]===0)) return 'rev';
  if(store.seen[dir][no]) return 'seen';
  return 'new';
}
const STATE_LABEL={fix:'定着（テストで別の日に2回正解）',self:'覚えた',rev:'要復習',seen:'学習した',new:'未学習'};
let tcfg=null, tst=null;
function testWords(cfg){
  if(CUR_BOOK!==cfg.book || WORDS.length===0) selectBook(cfg.book);
  const map=new Map(WORDS.map(w=>[w.no,w]));
  return {map:map, words:cfg.nos.map(no=>map.get(no)).filter(Boolean)};
}
function startTest(cfg){
  const tw=testWords(cfg), map=tw.map;
  if(WORDS.length<4 || !tw.words.length){ alert('テストに使える単語がありません。'); return; }
  const txt=o=>cfg.dir==='en2ja'?o.jm:o.e;
  const picks=shuffleArr(tw.words.slice()).slice(0,cfg.n);
  let poolWords = cfg.poolNos ? cfg.poolNos.map(no=>map.get(no)).filter(Boolean) : WORDS;
  if(poolWords.length<12) poolWords=WORDS;
  const items=picks.map(w=>{
    const same=poolWords.filter(x=>x.no!==w.no && x.pos===w.pos);
    const base=same.length>=6 ? same : poolWords.filter(x=>x.no!==w.no);
    const seenTxt=new Set([txt(w)]), dis=[];
    shuffleArr(base.slice()).forEach(x=>{ if(dis.length<3 && !seenTxt.has(txt(x))){ seenTxt.add(txt(x)); dis.push(x); } });
    const opts=shuffleArr([w].concat(dis)).map(o=>({no:o.no,text:txt(o)}));
    return {w:w, opts:opts, pick:null, spoken:false};
  });
  tst={cfg:cfg, items:items, i:0, ok:0, saved:false, msg:''};
  nav('testView');
}
function renderTestView(){
  if(!tst){ goHome(); return; }
  titleEl.textContent=tst.cfg.title||'テスト';
  if(tst.i>=tst.items.length){ renderTestResult(); return; }
  const it=tst.items[tst.i], w=it.w, dir=tst.cfg.dir, answered=it.pick!==null, n=tst.items.length;
  const stem = dir==='en2ja' ? `${esc(w.e)} ${spkBtn(w.e)}<span class="stem-read">${w.ipa?'['+esc(w.ipa)+']':''}</span>` : esc(w.ja);
  const opts=it.opts.map((o,i)=>{
    let cls=''; if(answered){ if(o.no===w.no) cls='correct'; else if(i===it.pick) cls='wrong'; }
    return `<div class="qopt ${cls}" ${answered?'':`onclick="testPick(${i})"`}>${esc(o.text)}</div>`;
  }).join('');
  const ok = answered && it.opts[it.pick].no===w.no;
  const fb = answered ? `<div class="tq-fb ${ok?'ok':'ng'}">${ok?'⭕ 正解！':'❌ 不正解'}　<b>${esc(w.e)}</b> ＝ ${esc(w.ja)}</div>

    <div class="tprog"><div style="width:${(tst.i/n*100).toFixed(1)}%"></div></div>
    <div class="tq-stem">${stem}</div>${opts}${fb}</div>`;
  if(!it.spoken && !answered){ it.spoken=true; stopSpeech(); if(store.autoSpeak && dir==='en2ja') speakSeq([w.e]); }
}
function testPick(i){
  const it=tst.items[tst.i]; if(!it || it.pick!==null) return;
  it.pick=i;
  const ok=it.opts[i].no===it.w.no;
  if(ok) tst.ok++;
  recordTest(it.w.no, tst.cfg.dir, ok);
  if(ok) touchWord(it.w.no, tst.cfg.dir);
  saveStore(); renderTestView();
}
function testNext(){ stopSpeech(); tst.i++; renderTestView(); }
function renderTestResult(){

    ${tst.msg?`<div class="goal-note" style="text-align:left">${tst.msg}</div>`:''}
    ${wrong.length?`<div style="text-align:left;margin-top:14px;"><b style="font-size:13px;">間違えた語（${wrong.length}語・復習セットに入りました）</b>${wl}</div>`:'<div style="margin-top:12px;">全問正解です！</div>'}
    <div style="margin-top:16px;">
      ${wrong.length?`<button class="startbtn" onclick="startWrongReview()">間違えた語をフラッシュカードで復習</button><div style="height:10px"></div>`:''}

      <div class="footer-note"><span style="text-decoration:underline;cursor:pointer" onclick="goBack()">戻る</span></div>
    </div></div>`;
}

    nos=all.filter(no=>{ const st=wordState(no,dir,ms,rs); return store.seen[dir][no] && rank[st]<9; });
    nos=shuffleArr(nos.slice()).sort((a,b)=>rank[wordState(a,dir,ms,rs)]-rank[wordState(b,dir,ms,rs)]);
    if(nos.length<4){ alert('テストできる「学習した語」がまだ少ないです。先に学習してから挑戦しましょう。'); return; }

  startTest({kind:tcfg.kind, goalId:g.id, book:g.book, nos:nos, poolNos:all, dir:dir, n:tcfg.n, title:g.name+(tcfg.kind==='mini'?'（ミニテスト）':'（到達度テスト）')});

/* ============ 学習カレンダー ============ */
let calY=0, calM=0, calSel=null;
function calMove(d){ calM+=d; if(calM<1){ calM=12; calY--; } if(calM>12){ calM=1; calY++; } calSel=null; renderCalendar(); }
function calPick(k){ calSel=k; renderCalendar(); }
function renderCalendar(){
  titleEl.textContent='学習カレンダー';
  if(!calY){ const n=new Date(Date.now()-DAY_START_HOUR*3600000); calY=n.getFullYear(); calM=n.getMonth()+1; }
  const tk=todayKey(), g=store.dailyGoal, st=computeStreaks();
  const first=new Date(calY,calM-1,1).getDay(), dim=new Date(calY,calM,0).getDate();
  const p2=n=>String(n).padStart(2,'0');
  let cells='';
  for(let i=0;i<first;i++) cells+='<div class="cal-cell blank"></div>';
  for(let d=1; d<=dim; d++){
    const k=calY+'-'+p2(calM)+'-'+p2(d), n=store.days[k]||0;
    const lv = n>=g?'l3':n>=MIN_DAY?'l2':n>0?'l1':'';
    cells+=`<div class="cal-cell ${lv} ${k>tk?'fut':''} ${k===tk?'today':''} ${k===calSel?'sel':''}" onclick="calPick('${k}')">${d}${n?`<small>${n}</small>`:''}${store.goals.some(x=>x.deadline===k)?'<small>🎯</small>':''}${store.rescued[k]?'<small>🛟</small>':''}</div>`;
  }
  let detail='日付をタップすると、その日の学習数が見られます。';
  if(calSel){
    const n=store.days[calSel]||0, a=calSel.split('-');
    detail=`<b>${+a[1]}月${+a[2]}日</b>　${n}語 ${n>=g?'🏆目標達成':n>=MIN_DAY?'✅学習した日':n>0?'（学習日には あと'+(MIN_DAY-n)+'語）':'（学習なし）'}${store.rescued[calSel]?'<br>🛟 翌日に2日分のノルマを達成して救済した日（連続日数に数えます）':''}`;
    const dues=store.goals.filter(x=>x.deadline===calSel).map(x=>esc(x.name));
    if(dues.length) detail+='<br>🎯 目標の期限: '+dues.join('、');
    { const lg=store.log[calSel]||{en2ja:[],ja2en:[]};
      if(lg.en2ja.length+lg.ja2en.length) detail+=`<div class="today-link" style="text-align:left" onclick="openReview('${calSel}')">🌙 この日に学習した語を振り返る（英→日 ${lg.en2ja.length}語／日→英 ${lg.ja2en.length}語）</div>`; }
  }
  const goalChips=[10,20,30,50,100].map(v=>`<div class="chip ${g===v?'active':''}" onclick="setDailyGoal(${v});renderCalendar()">${v}語</div>`).join('');
  main.innerHTML=`
    <div class="stat-row" style="margin-bottom:12px;">
      <div><b>${st.cur}</b><i>日</i><small>🔥連続</small></div>
      <div><b>${st.total}</b><i>日</i><small>累計</small></div>
      <div><b>${st.best}</b><i>日</i><small>最長連続</small></div>
    </div>
    <div class="setup-block"><h3>1日の目標（めくった語数）</h3><div class="tabs">${goalChips}</div></div>
    <div class="cal-head"><button onclick="calMove(-1)">‹</button><b>${calY}年${calM}月</b><button onclick="calMove(1)">›</button></div>
    <div class="cal-grid">${['日','月','火','水','木','金','土'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>
    <div class="cal-detail">${detail}</div>
    <div class="cal-legend"><span><i style="background:#f6e2a0"></i>1〜${MIN_DAY-1}語</span><span><i style="background:#9fcdb3"></i>学習した日（${MIN_DAY}語〜）</span><span><i style="background:var(--ok)"></i>目標達成</span></div>
    <div class="today-link" onclick="nav('goals')">🎯 目標を見る・作る</div>
    <div class="footer-note">カードを裏返した語（ゲームで正解した語も）を、1日に1語1回まで数えます。<br>日付は朝4時に切り替わります。<br>1週間に1日までのお休みなら、連続日数は途切れません。<br>目標を設定していて、お休みの翌日に今日のノルマの2倍以上を進めると、休んだ1日を救済します（連続して休んだ場合は救済できません）。<br>累計日数は減りません。</div>`;
}

function exportStore(){
  const data = JSON.stringify(store, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `一生使える英単熟語帳進捗データ（${localDateStr()}）.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  markBackedUp();
}

function applyImportedStore(obj){
  if(!obj || typeof obj !== 'object' || !obj.mastered || !obj.review || Array.isArray(obj.mastered) || Array.isArray(obj.review)){
    alert('読み込みに失敗しました。ファイル／テキストの形式が正しくないようです。');
    return false;
  }
  store = normStore({
    mastered: obj.mastered,
    review: obj.review,
    matchBest: obj.matchBest,
    autoSpeak: obj.autoSpeak,
    days: obj.days, seen: obj.seen, today: obj.today, dailyGoal: obj.dailyGoal, goals: obj.goals,
    log: obj.log, shown: obj.shown, tw: obj.tw,
    lastBook: obj.lastBook, lastDir: obj.lastDir,
    lastSession: obj.lastSession || undefined,
    invRank: obj.invRank || {},
    invSet: obj.invSet || undefined,
    dojo: obj.dojo,
    bookVer: obj.bookVer
  });
  invSet = store.invSet || {bgm:true,se:true};
  saveStore();
  alert('読み込みが完了しました。');
  nav('dataManage', false);
  return true;
}

function importStoreFromFile(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const obj = JSON.parse(e.target.result);
      applyImportedStore(obj);
    }catch(err){
      alert('読み込みに失敗しました。ファイルの内容が正しいJSON形式か確認してください。');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function importStoreFromText(){
  const txt = document.getElementById('dataTextIn').value.trim();
  if(!txt){ alert('テキストが入力されていません。'); return; }
  try{
    const obj = JSON.parse(txt);
    applyImportedStore(obj);
  }catch(err){
    alert('読み込みに失敗しました。貼り付けたテキストが正しいJSON形式か確認してください。');
  }
}

/* ============ フラッシュカード：設定 ============ */
let fcCfg = {unit:1, part:'all', pos:'all', dir:'en2ja', order:'seq', src:'all'};
const PART_NAMES = ['前半','中盤','後半'];
function partInfo(u){
  const ws=unitWords(u), n=ws.length, sz=Math.ceil(n/3), out=[];
  for(let k=0;k<3;k++){
    const a=ws.slice(k*sz,(k+1)*sz);
    if(a.length) out.push({k, lo:a[0].bn, hi:a[a.length-1].bn});
  }
  return out;
}
/* 品詞の絞り込み用：他動詞(vt)・自動詞(vi)・動詞(v)は「動詞」にまとめる（カード表記は変えない） */
function isVerbPos(p){ return p==='v' || p==='vt' || p==='vi'; }
const POS_FILTER_ORDER = ['n','v','a','adv','idm','conj','prep','pre','suf','int'];
function fcPool(){
  let ws=unitWords(fcCfg.unit);
  if(fcCfg.part!=='all'){
    const sz=Math.ceil(ws.length/3), k=+fcCfg.part;
    ws=ws.slice(k*sz,(k+1)*sz);
  }
  return ws;
}
function setFcUnit(u){ fcCfg.unit=u; fcCfg.part='all'; fcCfg.pos='all'; renderFcSetup(); }
function setFcPart(p){ fcCfg.part=p; fcCfg.pos='all'; renderFcSetup(); }
function renderFcSetup(){
  titleEl.textContent='フラッシュカード設定';
  if(!isAvail(fcCfg.unit)) fcCfg.unit = UNIT_AVAIL[0]||1;
  const unitChips = unitChipsHtml(fcCfg.unit,'setFcUnit');

  const parts = partInfo(fcCfg.unit);
  const total = unitWords(fcCfg.unit).length;
  const partChips = `<div class="chip ${fcCfg.part==='all'?'active':''}" onclick="setFcPart('all')">Unit全体<small>No.1〜${total}</small></div>` +
    parts.map(p=>`<div class="chip ${String(fcCfg.part)===String(p.k)?'active':''}" onclick="setFcPart(${p.k})">${PART_NAMES[p.k]}<small>No.${p.lo}〜${p.hi}</small></div>`).join('');

  const pool = fcPool();
  const posSet = POS_FILTER_ORDER.filter(p=> p==='v' ? pool.some(w=>w.ps.some(isVerbPos)) : pool.some(w=>w.ps.includes(p)));
  if(fcCfg.pos!=='all' && !posSet.includes(fcCfg.pos)) fcCfg.pos='all';
  const posChips = ['all',...posSet].map(p=>{
    const label = p==='all' ? '全て' : POS_LABEL[p];
    return `<div class="chip ${fcCfg.pos===p?'active':''}" onclick="fcCfg.pos='${p}';renderFcSetup()">${label}</div>`;
  }).join('');

  const reviewCount = curReview(fcCfg.dir).length;
  const unseenCount = (()=>{ const s0=fcCfg.src; fcCfg.src='unseen'; const n=buildFcDeck().length; fcCfg.src=s0; return n; })();
  const srcChips = `
    <div class="chip ${fcCfg.src==='all'?'active':''}" onclick="fcCfg.src='all';renderFcSetup()">通常セット</div>
    <div class="chip ${fcCfg.src==='unseen'?'active':''} ${unseenCount===0?'disabled':''}" ${unseenCount===0?'':`onclick="fcCfg.src='unseen';renderFcSetup()"`}>未学習のみ (${unseenCount})</div>
    <div class="chip ${fcCfg.src==='review'?'active':''} ${reviewCount===0?'disabled':''}" ${reviewCount===0?'':`onclick="fcCfg.src='review';renderFcSetup()"`}>復習セットのみ (${reviewCount})</div>
  `;

  const resumeBlock = (store.lastSession && store.lastSession.book===CUR_BOOK) ? `
    <div class="setup-block">
      <div class="menu-card" style="padding:14px;" onclick="resumeSession()">
        <div class="ico">↺</div>
        <div class="tx"><b>前回の続きから再開</b><span>Unit ${store.lastSession.unit} ・ ${store.lastSession.idx+1}/${store.lastSession.deckNos.length}語目</span></div>
      </div>
    </div>` : '';

  main.innerHTML = `
    ${resumeBlock}
    <div class="setup-block">
      <h3>Unit</h3>
      <div class="tabrow">${unitChips}</div>
    </div>
    <div class="setup-block">
      <h3>範囲</h3>
      <div class="tabs">${partChips}</div>
    </div>
    <div class="setup-block">
      <h3>品詞</h3>
      <div class="tabs">${posChips}</div>
    </div>
    <div class="setup-block">
      <h3>方向</h3>
      <div class="tabs">
        <div class="chip ${fcCfg.dir==='en2ja'?'active':''}" onclick="fcCfg.dir='en2ja';renderFcSetup()">英語 → 日本語</div>
        <div class="chip ${fcCfg.dir==='ja2en'?'active':''}" onclick="fcCfg.dir='ja2en';renderFcSetup()">日本語 → 英語</div>
      </div>
    </div>
    <div class="setup-block">
      <h3>自動音声（カードが表示されたら自動で読み上げ）</h3>
      <div class="tabs">
        <div class="chip ${store.autoSpeak?'active':''}" onclick="setAutoSpeak(true);renderFcSetup()">ON</div>
        <div class="chip ${!store.autoSpeak?'active':''}" onclick="setAutoSpeak(false);renderFcSetup()">OFF</div>
      </div>
    </div>
    <div class="setup-block">
      <h3>順序</h3>
      <div class="tabs">
        <div class="chip ${fcCfg.order==='seq'?'active':''}" onclick="fcCfg.order='seq';renderFcSetup()">順番通り</div>
        <div class="chip ${fcCfg.order==='rand'?'active':''}" onclick="fcCfg.order='rand';renderFcSetup()">ランダム</div>

    </div>

    <div class="setview-row">

      <button class="setview-btn later" onclick="openSetModal('review')">🟨 復習セットを見る<small>${curReview().length}語</small></button>
    </div>
  `;
}

function buildFcDeck(){
  let pool = fcPool();
  if(fcCfg.pos!=='all') pool = pool.filter(w=> fcCfg.pos==='v' ? w.ps.some(isVerbPos) : w.ps.includes(fcCfg.pos));
  if(fcCfg.src==='review') pool = pool.filter(w=>isReview(w.no,fcCfg.dir));
  else if(fcCfg.src==='unseen') pool = pool.filter(w=>!store.seen[fcCfg.dir][w.no] && !isMastered(w.no,fcCfg.dir));
  else pool = pool.filter(w=>!isMastered(w.no,fcCfg.dir));
  if(fcCfg.order==='rand') pool = shuffleArr(pool.slice());
  return pool;
}

let fcDeck=[], fcIdx=0, fcFlipped=false;
let fcAutoPending=false;   // 新しいカードが表示されたときだけ自動音声を鳴らすための印（モーダルを閉じた再描画などでは鳴らさない）
function setAutoSpeak(on){

let fcTodayMode=false, fcGoalId=null, fcTitle='', fcShownKey=null;
/* 今日すでに画面に出した語を記録し、新しくデッキを作るときに避ける／同じ日の途中なら前回の続きから再開する */
function shownList(key){ const k=todayKey(); if(store.shown.d!==k) store.shown={d:k,k:{}}; return store.shown.k[key]||(store.shown.k[key]=[]); }
function markShown(key,no){ const a=shownList(key); if(!a.includes(no)){ a.push(no); saveStore(); } }
function resumeInfo(goalId){
  const s=store.lastSession;
  if(!s || !s.today || s.key!==(goalId||('free-'+(store.lastDir||'en2ja'))) || s.day!==todayKey() || !Array.isArray(s.deckNos) || s.idx>=s.deckNos.length) return null;
  if(goalId){ const g=store.goals.find(x=>x.id===goalId); if(!g || g.doneAt || g.book!==s.book) return null; }
  return {idx:s.idx, len:s.deckNos.length};
}
function tryResume(goalId){
  if(!resumeInfo(goalId)) return false;
  if(CUR_BOOK!==store.lastSession.book || WORDS.length===0) selectBook(store.lastSession.book);
  resumeSession();
  return true;
}
function pickTodayBook(){
  if(store.lastBook && bookUnitsAvail(store.lastBook).length) return store.lastBook;
  const b=BOOKS.find(b=>bookUnitsAvail(b.id).length>0); return b?b.id:null;
}
function buildTodayDeck(dir){
  const N=10, picked=[], has=new Set();
  const add=w=>{ if(picked.length<N && !has.has(w.no)){ picked.push(w); has.add(w.no); } };
  const sn=store.seen[dir], sh=new Set(shownList('free-'+dir)), tn=new Set(store.today.d===todayKey()?store.today[dir]:[]);
  const okNew=w=>!sh.has(w.no) && !tn.has(w.no);
  WORDS.filter(w=>isReview(w.no,dir) && okNew(w)).sort((a,b)=>(sn[a.no]||0)-(sn[b.no]||0)).slice(0,3).forEach(add);
  WORDS.filter(w=>!sn[w.no] && !isMastered(w.no,dir) && okNew(w)).forEach(add);
  WORDS.filter(w=>!isMastered(w.no,dir)).sort((a,b)=>(sn[a.no]||0)-(sn[b.no]||0)).forEach(add);
  return picked;
}
function startToday(){
  if(tryResume(null)) return;
  const bid=pickTodayBook();
  if(!bid){ alert('収録済みの単語帳がありません。'); return; }
  if(CUR_BOOK!==bid || WORDS.length===0) selectBook(bid);
  const dir = store.lastDir || 'en2ja';
  fcCfg.dir = dir; fcCfg.src='all'; fcCfg.order='seq';
  fcTodayMode = true; fcGoalId=null; fcTitle=''; fcShownKey='free-'+dir;
  fcDeck = buildTodayDeck(dir);
  if(!fcDeck.length){ alert('今日の分で出せる新しい語がありません。「🌙 今日の振り返り」で復習するか、明日また続けましょう。'); return; }
  fcIdx=0; fcFlipped=false; fcAutoPending=true;
  saveSession();
  nav('fcView');
}
/* 目標の今日のノルマ：範囲内で、見た回数が少ない語から順に（番号順） */
/* 前回の続きから：前回に使った方向で、前回最後に表示したカードから範囲の最後まで普通に続ける（「覚えた」は飛ばす）。
   その方向を終えたら、次に押したときはもう一方の方向を範囲の最初から出す */
function startGoalStudy(kind){
  const g=goalOf(kind) || primaryGoal();
  if(!g || g.doneAt){ nav('goals'); return; }
  if(CUR_BOOK!==g.book || WORDS.length===0) selectBook(g.book);
  const el=goalEligible(g);
  if(!el.en2ja.length && !el.ja2en.length){ alert('この目標の範囲は、すべて学習済みです。'); return; }
  const cur=g.cur, order = cur.last==='ja2en' ? ['ja2en','en2ja'] : ['en2ja','ja2en'], gnos=goalNos(g);
  const startedToday = !!(g.today && g.today.d===todayKey() && g.today.n>0);
  let dir=null, list=null;
  /* 今日まだ始めていないとき：この目標の範囲で単語マップが「未学習」の語のうち、番号が一番小さい語から */
  if(!startedToday){
    for(const d of order){
      const first=gnos.find(no=>wordState(no,d)==='new');
      if(first===undefined) continue;
      const l=el[d].filter(no=>no>=first);
      if(l.length){ dir=d; list=l; break; }
    }
  }
  /* 今日すでに始めている／未学習がないとき：前回最後に見たカードの次から、周回を続ける */
  if(!dir){ for(const d of order){ const l=el[d].filter(no=>no>=cur[d]); if(l.length){ dir=d; list=l; break; } } }
  if(!dir){ DIRS.forEach(d=>{ cur[d]=0; }); for(const d of order){ if(el[d].length){ dir=d; list=el[d]; break; } } }
  const wm=new Map(WORDS.map(w=>[w.no,w]));
  /* スタート地点より前のカード（範囲の先頭まで。「覚えた」は除く）も、デッキの前側に入れて、左へ戻れるようにする */
  const startNo=list[0];
  const pre=gnos.filter(no=>no<startNo && !isMastered(no,dir));
  fcCfg.dir=dir; fcCfg.src='all'; fcCfg.order='seq'; store.lastDir=dir; cur.last=dir;
  fcTodayMode=true; fcGoalId=g.id; fcTitle=g.name+'（'+DIR_LABEL[dir]+'）'; fcShownKey=null;
  fcDeck=pre.concat(list).map(no=>wm.get(no)).filter(Boolean);
  fcIdx=Math.min(pre.length, Math.max(0,fcDeck.length-1)); fcFlipped=false; fcAutoPending=true;
  saveSession();
  nav('fcView');
}
function setGoalDir(kind,dir){ const g=goalOf(kind); if(!g) return; g.cur.last=dir; saveStore(); renderHome(); }
function startFc(){
  fcTodayMode=false; fcGoalId=null; fcTitle=''; fcShownKey=null;
  store.lastDir = fcCfg.dir;
  fcDeck = buildFcDeck();
  fcIdx=0; fcFlipped=false; fcAutoPending=true;
  saveSession();
  nav('fcView');
}
function saveSession(){
  store.lastSession = {
    book: CUR_BOOK, unit: fcCfg.unit, part: fcCfg.part, pos: fcCfg.pos, dir: fcCfg.dir, order: fcCfg.order, src: fcCfg.src,
    deckNos: fcDeck.map(w=>w.no), idx: fcIdx, today: fcTodayMode, goalId: fcGoalId, title: fcTitle, key: fcShownKey, day: todayKey()
  };
  saveStore();
}
function resumeSession(){
  const s = store.lastSession;
  if(!s) return;
  fcCfg = {unit:s.unit, part:(s.part===undefined?'all':s.part), pos:(s.pos==='vt'||s.pos==='vi'?'v':s.pos), dir:s.dir, order:s.order, src:s.src};
  fcDeck = s.deckNos.map(no=>WORDS.find(w=>w.no===no)).filter(Boolean);
  fcIdx = Math.min(s.idx, Math.max(0,fcDeck.length-1));
  fcFlipped = false; fcAutoPending=true; fcTodayMode = !!s.today; fcGoalId = s.goalId||null; fcTitle = s.title||''; fcShownKey = s.key===undefined ? null : s.key;
  nav('fcView');
}

function renderFcView(){
  const partTxt = fcCfg.part==='all' ? '' : ' '+PART_NAMES[+fcCfg.part];
  titleEl.textContent = fcTodayMode ? (fcTitle||'今日の10語') : 'Unit '+fcCfg.unit+partTxt+' · '+(fcCfg.pos==='all'?'全品詞':POS_LABEL[fcCfg.pos]);
  if(fcDeck.length===0){
    stopSpeech();
    main.innerHTML = `<div class="deckdone"><div class="big">🎉</div>この条件のカードはありません。<br>（すべて覚えたセットに入っているか、条件に合う単語がありません）
    <div style="margin-top:16px;"><button class="startbtn" onclick="nav('fcSetup')">設定に戻る</button></div>${fcUndo&&fcUndo.deck===fcDeck?'<div class="card-actions undo-row">'+fcUndoBtnHtml()+'</div>':''}</div>`;
    return;
  }
  if(fcIdx>=fcDeck.length){
    stopSpeech();
    main.innerHTML = `<div class="deckdone"><div class="big">✅</div>このセットは最後まで確認しました。<br>
    ${fcTodayMode?`<div style="margin:10px 0 4px;font-size:14px;">今日 <b>${todayCount()}</b>語　🔥${computeStreaks().cur}日連続</div>`:''}
    ${fcUndo&&fcUndo.deck===fcDeck?'<div class="card-actions undo-row">'+fcUndoBtnHtml()+'</div>':''}<div style="margin-top:16px;">${fcGoalId?`<button class="startbtn" onclick="startGoalStudy('${fcGoalId}')">続けて学習する</button><div style="height:10px"></div>`:''}<button class="startbtn" style="${fcTodayMode?'background:var(--ink)':''}" onclick="fcIdx=0;fcAutoPending=true;renderFcView()">もう一度見る</button>${fcTodayMode?`<div class="footer-note"><span style="text-decoration:underline;cursor:pointer" onclick="goHome()">トップへ戻る</span></div>`:''}</div></div>`;
    return;
  }
  const w = fcDeck[fcIdx];
  const isE2J = fcCfg.dir==='en2ja';

  const frontHtml = isE2J
    ? `<div class="en-word">${esc(w.e)}</div><div class="en-ipa">${w.ipa?'['+esc(w.ipa)+']':''}</div>${spkBtn(w.e)}`
    : `<div class="ja-word">${esc(w.ja)}</div>`;

  const backHtml = `
    <div class="bhead">
      <span class="en">${esc(w.e)}</span><span class="ipa">${w.ipa?'['+esc(w.ipa)+']':''}</span>
      ${spkBtn(w.e)}
    </div>
    ${detailHtml(w)}
  `;

  main.innerHTML = `
    <div id="fcHeader">
      <span id="fcPos">${fcIdx+1} / ${fcDeck.length}　·　${posBadge(w)}</span>
      <div class="setbtns">
        <div class="setbtn ${store.autoSpeak?'on':''}" id="autoBtn" onclick="toggleAutoSpeak()">🔊自動 ${store.autoSpeak?'ON':'OFF'}</div>
        <div class="setbtn" onclick="openSetModal('mastered')">覚えた${curMastered().length}</div>
        <div class="setbtn" onclick="openSetModal('review')">復習${curReview().length}</div>
      </div>
    </div>
    <input type="range" class="fc-range" min="1" max="${fcDeck.length}" value="${fcIdx+1}" step="1" aria-label="カード位置" oninput="fcSlideInput(this.value)" onchange="fcSlideChange(this.value)">
    <div class="stage">
      <div class="card-outer" id="cardOuter" onclick="cardTap(event)">
        <div class="card-inner">
          <div class="card-face front">
            <span class="cf-num">Unit ${w.unit} · No.${w.bn}</span>
            <span class="pos-badge">${posBadge(w)}</span>
            <div class="front-mid">${frontHtml}</div>
            <div class="tapfoot">タップで裏返す ／ 左右の端をタップ・スワイプで前後移動</div>
          </div>
          <div class="card-face back">
            <span class="cf-num">Unit ${w.unit} · No.${w.bn}</span>
            ${backHtml}
          </div>
        </div>
      </div>
    </div>
    <div class="card-actions">
      <button class="act-btn memo" onclick="fcMark('mastered')">✅ 覚えた</button>
      <button class="act-btn later" onclick="fcMark('review')">🔖 また後で</button>
    </div>
    <div class="card-actions undo-row">${fcUndoBtnHtml()}</div>
  `;
  const outer=document.getElementById('cardOuter');
  if(fcFlipped) outer.classList.add('flipped');
  attachSwipe(outer);
  /* 新しいカードが表示されたとき：前の音声を止め、表面が英語なら単語を自動再生（日本語だけの面は無音） */
  if(fcAutoPending){
    fcAutoPending=false;
    stopSpeech();
    if(fcTodayMode && fcShownKey) markShown(fcShownKey, w.no);
    if(fcGoalId) goalSetCursor(fcGoalId, fcCfg.dir, w.no);
    if(store.autoSpeak && isE2J) speakSeq([w.e]);
  }
}


function cardTap(e){
  if(e.target.closest('.spk')) return; // 音声ボタンはこちらの処理をせず優先させる
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  if(ratio < 1/6) fcNav(-1);
  else if(ratio > 5/6) fcNav(1);
  else fcFlip();
}
function fcFlip(){
  fcFlipped=!fcFlipped;
  document.getElementById('cardOuter').classList.toggle('flipped');
  const w=fcDeck[fcIdx];
  if(fcFlipped && w) touchWord(w.no, fcCfg.dir);     // 裏面まで見たら1語として数える
  stopSpeech();
  /* 裏返したとき：英→日は例文1→例文2、日→英は（表で単語が鳴っていないので）単語→例文1→例文2。表に戻したときは鳴らさない */
  if(fcFlipped && store.autoSpeak && w){
    const ex=[exPlain(w.x[0]), exPlain(w.x[1])];
    speakSeq(fcCfg.dir==='en2ja' ? ex : [w.e, ...ex]);
  }
}
function fcNav(dir){
  const outer=document.getElementById('cardOuter');
  outer.classList.add(dir<0?'leaving-r':'leaving-l');
  setTimeout(()=>{
    fcIdx += dir;
    if(fcIdx<0) fcIdx=0;
    fcFlipped=false; fcAutoPending=true;
    saveSession();
    renderFcView();
  },140);
}
/* デッキ作成時の並び順（「もとに戻す」で、元の位置へ戻すために使う）。デッキが入れ替わったら作り直す */
let fcUndo=null;   // 直前の「覚えた」「また後で」（1回分）。デッキが作り直されたら無効
let fcRank=null, fcRankFor=null;
function fcEnsureRank(){ if(fcRankFor!==fcDeck){ fcRank=new Map(fcDeck.map((w,i)=>[w.no,i])); fcRankFor=fcDeck; } }
function fcMark(type){
  const w=fcDeck[fcIdx], d=fcCfg.dir;
  fcAutoPending=true;
  fcUndo={type:type, w:w, dir:d, idx:fcIdx, wasM:isMastered(w.no,d), wasR:isReview(w.no,d), deck:fcDeck};
  if(type==='mastered'){
    fcEnsureRank();
    touchWord(w.no,d);      // めくらずに「覚えた」を押した場合も、学習した問として数える
    if(!isMastered(w.no,d)) store.mastered[d].push(w.no);
    store.review[d] = store.review[d].filter(n=>n!==w.no);
    saveStore();
    fcDeck.splice(fcIdx,1);
    fcFlipped=false;
    saveSession();
    renderFcView();
  } else {
    if(!isReview(w.no,d)) store.review[d].push(w.no);
    saveStore();
    fcFlipped=false;
    fcIdx++;
    saveSession();
    renderFcView();
  }
}
/* 直前の「覚えた」「また後で」を取り消す：覚えた／復習のリストを元の状態に戻し、単語をデッキの元の位置に戻して、その単語のおもて面を表示する。
   学習数・目標の「やった数」は戻さない（同じ周で同じ語は数え直さないので、見直しても二重にならない） */
function fcUndoLast(){
  const u=fcUndo;
  if(!u || u.deck!==fcDeck){ fcUndo=null; renderFcView(); return; }
  const no=u.w.no, d=u.dir;
  if(!u.wasM) store.mastered[d]=store.mastered[d].filter(n=>n!==no);
  if(!u.wasR) store.review[d]=store.review[d].filter(n=>n!==no);
  if(u.wasR && !isReview(no,d)) store.review[d].push(no);
  if(u.wasM && !isMastered(no,d)) store.mastered[d].push(no);
  saveStore();
  let idx=u.idx;
  if(u.type==='mastered'){
    const at=fcDeck.findIndex(x=>x.no===no);
    if(at>=0) idx=at; else { idx=Math.min(idx,fcDeck.length); fcDeck.splice(idx,0,u.w); }
  } else {
    const at=fcDeck.findIndex(x=>x.no===no);
    if(at>=0) idx=at;
  }
  fcIdx=idx; fcFlipped=false; fcAutoPending=true; fcUndo=null;
  saveSession();
  renderFcView();
  showToast('↩ 元に戻しました：'+u.w.e);
}
function fcUndoBtnHtml(){
  const u=(fcUndo && fcUndo.deck===fcDeck) ? fcUndo : null;
  return `<button class="act-btn undo" ${u?'':'disabled'} onclick="fcUndoLast()">↩ 直前の操作を元に戻す${u?'<small>（'+(u.type==='mastered'?'覚えた':'また後で')+'：'+esc(u.w.e)+'）</small>':''}</button>`;
}
function attachSwipe(el){
  let x0=null,y0=null;
  el.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){
      fcNav(dx<0?1:-1);
    }
    x0=null;
  },{passive:true});
}

/* ============ セット管理モーダル ============ */
let setOpen={};   // 開いているUnit
function openSetModal(type,keep){
  if(!keep) setOpen={};
  const old=document.querySelector('.modal-sheet'), top=old?old.scrollTop:0;
  const list = type==='mastered'?curMastered():curReview();
  const title = (type==='mastered'?'覚えたセット':'復習セット')+'【'+DIR_LABEL[fcCfg.dir]+'】';
  const wm=new Map(WORDS.map(w=>[w.no,w])), byUnit={};
  list.forEach(no=>{ const w=wm.get(no); if(w) (byUnit[w.unit]||(byUnit[w.unit]=[])).push(w); });
  const us=Object.keys(byUnit).map(Number).sort((a,b)=>a-b);
  const body = us.map(u=>`<div class="set-unit"><div class="set-unit-h" onclick="setToggle(${u},'${type}')"><span>${setOpen[u]?'▼':'▶'} Unit ${u}</span><b>${byUnit[u].length}語</b></div>${
      setOpen[u] ? byUnit[u].sort((a,b)=>a.bn-b.bn).map(w=>`<div class="modal-row"><span>${esc(w.e)} <span style="color:var(--sub)">${esc(w.jm)}</span></span>
        <button onclick="restoreWord(${w.no},'${type}')">もとに戻す</button></div>`).join('') : ''}</div>`).join('') || `<div class="empty-note">まだありません。</div>`;
  const ctl = us.length ? `<div class="set-ctl"><button onclick="setAll(true,'${type}')">すべて開く</button><button onclick="setAll(false,'${type}')">すべて閉じる</button></div>` : '';
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal-sheet">
        <h3>${title}（${list.length}）</h3>
        ${ctl}${body}
        <button class="modal-close" onclick="closeModal()">閉じる</button>
      </div>
    </div>`;
  const sh=document.querySelector('.modal-sheet'); if(sh) sh.scrollTop=top;
}
function setToggle(u,type){ setOpen[u]=!setOpen[u]; openSetModal(type,true); }
function setAll(open,type){
  const list = type==='mastered'?curMastered():curReview(), wm=new Map(WORDS.map(w=>[w.no,w]));
  setOpen={}; if(open) list.forEach(no=>{ const w=wm.get(no); if(w) setOpen[w.unit]=true; });
  openSetModal(type,true);
}
function restoreWord(no,type){
  const d=fcCfg.dir;
  if(type==='mastered') store.mastered[d] = store.mastered[d].filter(n=>n!==no);
  else store.review[d] = store.review[d].filter(n=>n!==no);
  saveStore();
  openSetModal(type,true);
  if(screen==='fcView') fcReinsert(no,type);
}
/* 「もとに戻す」した語を、今見ているデッキへすぐ戻す。元の並び順の位置に入れる（すでに過ぎた位置なら、左へ送ると戻れる） */
function fcReinsert(no,type){
  const d=fcCfg.dir, idxOf=n=>fcDeck.findIndex(w=>w.no===n);
  if(type!=='mastered'){
    /* 復習セットから出した語は、「また後で」だけのデッキでは対象外になる */
    if(!fcTodayMode && fcCfg.src==='review'){
      const i=idxOf(no);
      if(i>=0){ fcDeck.splice(i,1); if(i<fcIdx) fcIdx--; if(fcIdx>fcDeck.length) fcIdx=fcDeck.length; saveSession(); }
    }
    return;
  }
  if(idxOf(no)>=0) return;
  const w=WORDS.find(x=>x.no===no); if(!w) return;
  fcEnsureRank();
  let ok;
  if(fcGoalId){ const g=goalOf(fcGoalId); ok = !!(g && !g.doneAt && goalEligible(g)[d].includes(no)); }
  else if(fcTodayMode) ok = fcRank.has(no);                  // 今日の10語・復習：このデッキから「覚えた」にした語だけ戻す
  else ok = buildFcDeck().some(x=>x.no===no);                // 通常のデッキ：今の条件（Unit・品詞・出題範囲）に合う語
  if(!ok) return;
  let pos;
  if(fcRank.has(no)){ const r=fcRank.get(no); pos=fcDeck.findIndex(x=>fcRank.has(x.no) && fcRank.get(x.no)>r); }
  else if(fcCfg.order==='rand' && !fcGoalId && !fcTodayMode) pos=Math.min(fcDeck.length,fcIdx+1);
  else { const ord=new Map(WORDS.map((x,i)=>[x.no,i])), r=ord.get(no); pos=fcDeck.findIndex(x=>ord.get(x.no)>r); }
  if(pos<0) pos=fcDeck.length;
  const atEnd = fcIdx>=fcDeck.length;
  fcDeck.splice(pos,0,w);
  if(atEnd) fcIdx=pos;                  // 最後まで終えた画面なら、戻した語をそのまま表示
  else if(pos<=fcIdx) fcIdx++;          // 今見ているカードはそのまま（戻した語は左へ送ると出る）
  fcFlipped=false;
  saveSession();
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; if(screen==='fcSetup') renderFcSetup(); if(screen==='fcView') renderFcView(); }

/* ============ フラッシュカード：スライダー ============ */
function fcSlideInput(v){
  const w=fcDeck[+v-1]; if(!w) return;
  document.getElementById('fcPos').textContent=`${v} / ${fcDeck.length}　·　${fcCfg.dir==='en2ja'?w.e:w.jm}`;
}
function fcSlideChange(v){
  fcIdx=Math.max(0,Math.min(fcDeck.length-1,+v-1));
  fcFlipped=false; fcAutoPending=true; saveSession(); renderFcView();
}

/* ============ クイズ ============ */
let quizCfg={mode:'en2ja', unitFrom:1, unitTo:1, hint:false};
let quizItems=[], quizMode='en2ja', quizHint=false;
const QUIZ_N = 10;
const QUIZ_MODES = {
  en2ja:'英語 → 日本語（4択）',
  ja2en:'日本語 → 英語（4択・例文穴埋め）',
  write:'記述（例文穴埋め）'
};
function setQuizFrom(u){ quizCfg.unitFrom=u; if(quizCfg.unitTo<u) quizCfg.unitTo=u; renderQuizSetup(); }
function setQuizTo(u){ quizCfg.unitTo=u; renderQuizSetup(); }
function renderQuizSetup(){
  titleEl.textContent='クイズ設定';
  if(!isAvail(quizCfg.unitFrom)) { quizCfg.unitFrom=UNIT_AVAIL[0]||1; quizCfg.unitTo=Math.max(quizCfg.unitTo,quizCfg.unitFrom); }
  const modeChips = Object.keys(QUIZ_MODES).map(m=>`<div class="chip ${quizCfg.mode===m?'active':''}" onclick="quizCfg.mode='${m}';renderQuizSetup()">${QUIZ_MODES[m]}</div>`).join('');
  const hintBlock = quizCfg.mode==='write' ? `
    <div class="setup-block">
      <h3>頭文字ヒント</h3>
      <div class="tabs">
        <div class="chip ${quizCfg.hint?'active':''}" onclick="quizCfg.hint=true;renderQuizSetup()">ON</div>
        <div class="chip ${!quizCfg.hint?'active':''}" onclick="quizCfg.hint=false;renderQuizSetup()">OFF</div>
      </div>
      <div class="subnote">ONにすると、空欄に答えの頭文字が表示されます（文字数は表示されません）。</div>
    </div>` : '';
  const pool = WORDS.filter(w=>w.unit>=quizCfg.unitFrom && w.unit<=quizCfg.unitTo);
  main.innerHTML = `
    <div class="setup-block">
      <h3>形式</h3>
      <div class="tabs">${modeChips}</div>
      <div class="subnote">${quizCfg.mode==='en2ja'?'英単語を見て、日本語の意味を4択から選びます。':quizCfg.mode==='ja2en'?'日本語と英語の例文を見て、空欄に入る英語を4択から選びます。':'日本語と英語の例文を見て、空欄に入る英語を入力します。見出し語そのままの形で答えます。'}</div>
    </div>
    ${hintBlock}
    <div class="setup-block">
      <h3>出題範囲（Unit ${quizCfg.unitFrom} 〜 Unit ${quizCfg.unitTo}）</h3>
      <div class="tabrow">${unitNumChipsHtml(quizCfg.unitFrom,'setQuizFrom')}</div>
      <div style="text-align:center;font-size:12px;color:var(--sub);margin:4px 0;">〜</div>
      <div class="tabrow">${unitNumChipsHtml(quizCfg.unitTo,'setQuizTo',quizCfg.unitFrom)}</div>
      <div class="subnote">対象 ${pool.length}語から${QUIZ_N}問を出題します。</div>
    </div>
    <button class="startbtn" onclick="startQuiz()">${QUIZ_N}問出題する</button>
  `;
}
function startQuiz(){
  const pool = WORDS.filter(w=>w.unit>=quizCfg.unitFrom && w.unit<=quizCfg.unitTo);
  if(pool.length<4){ alert('出題範囲の単語が足りません。'); return; }
  quizMode = quizCfg.mode; quizHint = quizCfg.hint;
  const picks = shuffleArr(pool.slice()).slice(0,QUIZ_N);
  quizItems = picks.map(w=>{
    const it = {word:w, k:Math.floor(Math.random()*2), selected:null, text:'', graded:false, override:false};
    if(quizMode!=='write'){
      const same = pool.filter(x=>x.pos===w.pos && x.no!==w.no);
      const dp = same.length>=3 ? same : pool.filter(x=>x.no!==w.no);
      it.opts = shuffleArr([w,...shuffleArr(dp.slice()).slice(0,3)]).map(o=>({no:o.no, w:o, text: quizMode==='en2ja'?o.jm:o.e}));
    }
    return it;
  });
  nav('quizView');
}
function normAns(s){ return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[~～]/g,'').replace(/\s+/g,' ').trim(); }
function quizCorrect(q){
  if(quizMode==='write') return q.override || normAns(q.text)===normAns(exAns(q.word.x[q.k]));
  return q.selected===q.word.no;
}
function quizRecord(q){   // クイズの結果も、テスト結果（定着の判定）と学習数に反映する
  const ok=quizCorrect(q);
  if(quizMode!=='write') recordTest(q.word.no, quizMode, ok);
  if(ok) touchWord(q.word.no, quizMode==='en2ja'?'en2ja':'ja2en');
  saveStore();
}
function renderQuizView(){
  titleEl.textContent='クイズ（'+QUIZ_MODES[quizMode].split('（')[0]+'）';
  if(!quizItems.length){ nav('quizSetup',false); return; }
  const html = quizItems.map((q,i)=>{
    const w=q.word, ok=q.graded&&quizCorrect(q);
    let stem='';
    if(quizMode==='en2ja'){
      stem = `<div class="stem">${esc(w.e)} ${spkBtn(w.e)}<span class="stem-read">${w.ipa?'['+esc(w.ipa)+']':''}</span></div>`;
    } else {
      const x=w.x[q.k];
      const en = q.graded ? exFilled(x, ok) : exBlank(x, quizMode==='write' && quizHint);
      stem = `<div class="cloze"><div class="cz-ja">${jaHtml(x[1])}</div><div class="cz-en">${en}</div></div>`;
    }
    let body='';
    if(quizMode==='write'){
      body = `<input class="qinput" type="text" inputmode="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="英語で入力" value="${esc(q.text)}" ${q.graded?'disabled':''} oninput="quizType(${i},this.value)" onkeydown="if(event.key==='Enter'){gradeQuiz(${i})}">`;
    } else {
      body = q.opts.map((o,j)=>{
        let cls='qopt';
        if(q.graded){ if(o.no===w.no) cls+=' correct'; else if(o.no===q.selected) cls+=' wrong'; }
        return `<label class="${cls}"><input type="radio" name="q${i}" ${q.selected===o.no?'checked':''} ${q.graded?'disabled':''} onchange="quizPick(${i},${o.no})"><span>${esc(o.text)}</span></label>`;
      }).join('');
    }
    let ctrl='';
    if(!q.graded){
      ctrl = `<div class="qctrl"><button onclick="gradeQuiz(${i})">答え合わせ</button></div>`;
    } else {
      const manual = (quizMode==='write' && !ok) ? `<button onclick="quizOverride(${i})">正解にする</button>` : '';
      const note = (quizMode==='write' && q.override) ? '（手動で正解）' : '';
      const ansTxt = (quizMode==='write' && !ok) ? `<span style="font-size:12.5px;">あなたの答え: <b>${esc(q.text||'（未入力）')}</b> ／ 正解: <b>${esc(exAns(w.x[q.k]))}</b></span>` : '';
      ctrl = `<div class="qctrl"><span class="qresult ${ok?'ok':'ng'}">${ok?'○ 正解'+note:'× 不正解'}</span>${ansTxt}${manual}</div>`;
    }
    let explain='';
    if(q.graded){
      let others='';
      if(quizMode!=='write'){
        others = `<div class="info-row"><span class="info-l">選択肢</span><span class="info-t">${q.opts.map(o=>`${esc(o.w.e)}：${esc(o.w.jm)}`).join('<br>')}</span></div>`;
      }
      explain = `<div class="explain"><div class="ex-head"><b>${esc(w.e)}</b> <span class="ipa">${w.ipa?'['+esc(w.ipa)+']':''}</span> ${spkBtn(w.e)}</div>${detailHtml(w)}${others?`<div class="info-box">${others}</div>`:''}</div>`;
    }
    return `<div class="quiz-item"><div class="qnum">Q${i+1} / ${quizItems.length}</div>${stem}${body}${ctrl}${explain}</div>`;
  }).join('');
  const done = quizItems.filter(q=>q.graded).length;
  const score = quizItems.filter(q=>q.graded&&quizCorrect(q)).length;
  const all = done===quizItems.length;
  main.innerHTML = html + `
    <div class="scorebar"><span>${all?`<b>${score*10}</b> 点（${score}/${quizItems.length}）`:`採点済み ${done}/${quizItems.length}`}</span>
      <span style="display:flex;gap:8px;">${all?`<button onclick="startQuiz()">もう一度</button>`:`<button onclick="gradeAllQuiz()">全問採点</button>`}<button onclick="nav('quizSetup')">設定へ</button></span></div>
    ${all&&score===quizItems.length?`<div class="footer-note" style="margin-top:8px;">全問正解です。100点満点！</div>`:''}
  `;
}
function quizPick(i,no){ quizItems[i].selected=no; }
function quizType(i,v){ quizItems[i].text=v; }
function gradeQuiz(i){
  const q=quizItems[i]; if(q.graded) return;
  if(quizMode!=='write' && q.selected===null){ alert('選択肢を選んでください。'); return; }
  q.graded=true; quizRecord(q); renderQuizView();
}
function gradeAllQuiz(){
  quizItems.forEach(q=>{ if(!q.graded){ q.graded=true; quizRecord(q); } });
  renderQuizView();
}
function quizOverride(i){ quizItems[i].override=true; renderQuizView(); }

/* ============ 単語一覧 ============ */
let listUnit=1;
function setListUnit(u){ listUnit=u; renderWordList(); window.scrollTo(0,0); }
function wlRowHtml(w, withId){
  return `<tr${withId?` id="wl-${w.bn}"`:''}>
    <td class="wl-a"><span class="wl-no">${w.bn}　${posBadge(w)}</span><b>${esc(w.e)}</b> ${spkBtn(w.e)}<br><span class="wl-sub">${w.ipa?'['+esc(w.ipa)+']':''}</span></td>
    <td class="wl-b">${esc(w.ja)}${infoHtml(w)}</td>
    <td class="wl-c">${exHtml(w.x[0])}<br><span class="wl-sub">${jaHtml(w.x[0][1])}</span><div class="wl-ex2">${exHtml(w.x[1])}<br><span class="wl-sub">${jaHtml(w.x[1][1])}</span></div></td></tr>`;

let listFocus=0;   // 検索結果から開いたとき、強調して表示する単語の番号
function renderWordList(){
  titleEl.textContent='単語一覧';
  if(!isAvail(listUnit)) listUnit=UNIT_AVAIL[0]||1;
  const chips=unitChipsHtml(listUnit,'setListUnit');
  const ws=unitWords(listUnit);
  const rows=ws.map(w=>wlRowHtml(w,true)).join('');

    <table class="wl"><thead><tr><th>単語</th><th>意味・語源など</th><th>例文</th></tr></thead><tbody>${rows}</tbody></table>`;
  if(listFocus){
